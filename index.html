<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파리바게뜨 자동권고주문 설정 현황 통합 대시보드 v3.0 (최종)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Noto Sans KR', sans-serif; } .chart-container { position: relative; height: 400px; width: 100%; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center"><img src="https://www.paris.co.kr/wp-content/themes/paris-baguette/images/logo_color.png" alt="Logo" class="h-8 mr-4"><h1 class="text-xl font-bold">자동권고주문 대시보드 v3.0</h1></div>
                <nav class="hidden md:flex space-x-4 text-sm"><a href="#total-status" class="hover:text-amber-300">전체현황</a><a href="#charts" class="hover:text-amber-300">다각도 차트</a><a href="#sv-details" class="hover:text-amber-300">SV담당별</a></nav>
            </div>
        </div>
    </header>
    <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="bg-white p-4 rounded-lg shadow-md mb-6 border border-slate-200">
            <div class="flex items-center"><span id="status-indicator"></span><p class="ml-3 text-sm font-medium">데이터 상태: <span id="last-updated" class="font-bold"></span></p></div>
        </div>
        <section id="total-status" class="mb-8">
            <h2 class="text-2xl font-bold mb-4 text-slate-800 border-l-4 border-blue-600 pl-4">1. 전체 가맹점 설정 요약 현황</h2>
            <div id="summary-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>
        <section id="charts" class="mb-8">
            <h2 class="text-2xl font-bold mb-4 text-slate-800 border-l-4 border-blue-600 pl-4">2. 사업부별/지역별 다각도 분석</h2>
            <div class="space-y-8">
                <div class="bg-white p-6 rounded-lg shadow-md border"><h3 class="text-lg font-semibold mb-4">사업부별 시스템 적용 현황</h3><div class="chart-container"><canvas id="departmentChart"></canvas></div></div>
                <div class="bg-white p-6 rounded-lg shadow-md border"><h3 class="text-lg font-semibold mb-4">지역별 자동권고 설정 분포 (상위 8개)</h3><div class="chart-container"><canvas id="regionChart"></canvas></div></div>
                <div class="bg-white p-6 rounded-lg shadow-md border"><h3 class="text-lg font-semibold mb-4">장기유통 유형 사업부별 설정 지표</h3><div class="chart-container"><canvas id="longTermDeptChart"></canvas></div></div>
                <div class="bg-white p-6 rounded-lg shadow-md border"><h3 class="text-lg font-semibold mb-4">장기유통 유형 사업팀별 설정 TOP 10</h3><div class="chart-container"><canvas id="longTermTeamChart"></canvas></div></div>
            </div>
        </section>
        <section id="sv-details" class="mb-8">
            <h2 class="text-2xl font-bold mb-4 text-slate-800 border-l-4 border-blue-600 pl-4">3. 담당 SV별 설정 현황</h2>
            <div class="bg-white rounded-lg shadow-md border overflow-x-auto">
                <table class="w-full text-sm text-left"><thead class="text-xs text-slate-700 uppercase bg-slate-100"><tr><th class="px-6 py-3">사업부</th><th class="px-6 py-3">사업팀</th><th class="px-6 py-3">담당 SV</th><th class="px-6 py-3 text-center">관리점포</th><th class="px-6 py-3 text-center">설정점포</th><th class="px-6 py-3 text-center">설정률</th><th class="px-6 py-3 text-center">유형별 평균품목수 (개)</th></tr></thead><tbody id="sv-table-body"></tbody></table>
            </div>
        </section>
    </main>
    <footer class="bg-slate-800 text-white mt-auto"><div class="container mx-auto p-4 text-center text-sm">&copy; 2024 PB Smart Order Team.</div></footer>
    <script>
        const dataManager = {
            charts: {},
            async init() {
                try {
                    const res = await fetch(`data.json?v=${new Date().getTime()}`);
                    if (!res.ok) throw new Error("Data loading failed");
                    const data = await res.json();
                    this.render(data);
                    document.getElementById('status-indicator').innerHTML = `<span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>`;
                    document.getElementById('last-updated').textContent = `로드 완료 (최종 업데이트: ${data.last_updated})`;
                } catch (e) {
                    document.getElementById('status-indicator').innerHTML = `<span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>`;
                    document.getElementById('last-updated').textContent = '데이터 로드 실패!';
                }
            },
            render(data) {
                this.renderSummary(data.summary);
                this.renderChart('departmentChart', { type: 'bar', data: { labels: Object.keys(data.department_summary), datasets: [{ label: '설정률 (%)', data: Object.values(data.department_summary).map(d => d.rate) }] }, options: { scales: { y: { max: 100 } } } });
                this.renderChart('regionChart', { type: 'bar', data: { labels: data.region_distribution.labels, datasets: [ { label: '점포수', data: data.region_distribution.total_stores, yAxisID: 'y' }, { label: '설정률', data: data.region_distribution.config_rate, type: 'line', yAxisID: 'y1' } ] }, options: { scales: { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false }, max: 100 } } } });
                this.renderChart('longTermDeptChart', { type: 'bar', data: { labels: Object.keys(data.long_term_by_department), datasets: [ { label: '설정점 수', data: Object.values(data.long_term_by_department).map(d => d.configured_stores) }, { label: '평균 품목 수', data: Object.values(data.long_term_by_department).map(d => d.avg_items) } ] }, options: { scales: { x: { stacked: true }, y: { stacked: true } } } });
                this.renderChart('longTermTeamChart', { type: 'bar', data: { labels: data.long_term_by_team_top10.map(t => t.team), datasets: [ { label: '설정점 수', data: data.long_term_by_team_top10.map(t => t.configured_stores) }, { label: '평균 품목 수', data: data.long_term_by_team_top10.map(t => t.avg_items), type: 'line' } ] } });
                this.renderSvTable(data.sv_summary);
            },
            renderSummary(summary) {
                const container = document.getElementById('summary-cards');
                // *** FIX: Display long_term_avg_items in the dedicated card ***
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-md border text-center"><h4 class="text-sm font-semibold text-slate-500">분석 대상 가맹점</h4><p class="text-4xl font-bold text-blue-600 mt-2">${(summary.total_stores || 0).toLocaleString()} <span class="text-xl">점</span></p></div>
                    <div class="bg-white p-6 rounded-lg shadow-md border text-center"><h4 class="text-sm font-semibold text-slate-500">자동권고 설정 가맹점</h4><p class="text-4xl font-bold text-blue-600 mt-2">${(summary.configured_stores || 0).toLocaleString()} <span class="text-xl">점</span></p></div>
                    <div class="bg-white p-6 rounded-lg shadow-md border text-center"><h4 class="text-sm font-semibold text-slate-500">장기유통 평균 품목수</h4><p class="text-4xl font-bold text-blue-600 mt-2">${summary.long_term_avg_items || 0} <span class="text-xl">개</span></p></div>
                    <div class="bg-white p-6 rounded-lg shadow-md border text-center"><h4 class="text-sm font-semibold text-slate-500">PB가맹 평균 설정률</h4><p class="text-4xl font-bold text-green-600 mt-2">${summary.config_rate || 0}<span class="text-xl">%</span></p></div>
                `;
            },
            renderChart(id, config) {
                const ctx = document.getElementById(id)?.getContext('2d');
                if (!ctx) return;
                if (this.charts[id]) this.charts[id].destroy();
                this.charts[id] = new Chart(ctx, { ...config, options: { responsive: true, maintainAspectRatio: false, ...config.options } });
            },
            renderSvTable(sv_summary) {
                const tableBody = document.getElementById('sv-table-body');
                tableBody.innerHTML = sv_summary.map(sv => `
                    <tr class="bg-white border-b hover:bg-slate-50">
                        <td class="px-6 py-4">${sv.department}</td><td class="px-6 py-4">${sv.team}</td>
                        <td class="px-6 py-4 font-medium">${sv.sv}</td><td class="px-6 py-4 text-center">${sv.managed_stores}</td>
                        <td class="px-6 py-4 text-center font-semibold text-blue-700">${sv.configured_stores}</td>
                        <td class="px-6 py-4 text-center font-semibold text-green-700">${sv.config_rate}%</td>
                        <td class="px-6 py-4 text-right">${Object.entries(sv.avg_items).map(([k, v]) => `<span class="bg-slate-200 text-xs font-semibold mr-1 px-2 py-0.5 rounded">${k} ${v}</span>`).join(' ')}</td>
                    </tr>`).join('');
            }
        };
        document.addEventListener('DOMContentLoaded', () => dataManager.init());
    </script>
</body>
</html>
